name: Android CI

on:
  push:
    branches: [main, feature/patrol-rules-offline-admin]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: porteirinho-main

    env:
      SUPABASE_URL: https://vnammkljeterezqtpvvm.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Android lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: porteirinho-apk
          path: porteirinho-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
